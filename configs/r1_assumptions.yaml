# Every number the R1 sim depends on that Unitree does NOT publish is here, with its source.
# Change these, re-run `python -m r1gym.check_model`, and every test/eval picks them up.
model:
  mjcf: r1gym/assets/r1/r1.xml   # Unitree unitree_rl_mjlab r1.xml @1425b15 (Apache-2.0); see docs/MODEL_AUDIT.md
  timestep: 0.005          # sim dt [s]; control at 50 Hz -> 4 substeps (matches unitree_rl_mjlab step_dt=0.02)
  control_dt: 0.02
# Torque caps [N*m]. The two official sources DISAGREE (see docs/MODEL_AUDIT.md):
#   unitree_mujoco ctrlrange : hip 88, knee 139, ankle 50, waist 50/88, arm 25
#   unitree_rl_mjlab effort  : hip/knee 60, ankle 50, waist 60, shoulder p/r 60, shoulder yaw/elbow/wrist 33
# Default = the element-wise MIN of the two (conservative: a policy that survives here should survive the robot).
torque_cap_policy: min     # one of: min | mujoco | mjlab
# Unitree's deploy gains (below) give ankle stiffness 40 N*m/rad < m*g*h ~ 190 N*m/rad, so the R1 can NOT stand on PD
# alone with them (it tips over in ~1 s; tests/test_gym.py::test_stand_pd_stands_and_stock_gains_fall checks it). Unitree's walking policy stabilises it actively.
# For the hit-robustness study we use `stand_pd` for BOTH the PD baseline and the RL policy (residual on top), so the
# only difference between the two is the learned feedback.
stand_pd:
  leg:   {kp: 300, kd: 10}   # chosen by sweep (scripts/sweep_stand.py): 0/10 falls at 0.04 rad init noise
  ankle: {kp: 300, kd: 10}
  waist: {kp: 200, kd: 5}
  shoulder: {kp: 40, kd: 2}
  arm:   {kp: 20,  kd: 1}
# Stock PD gains + home pose: copied from unitree_rl_mjlab deploy/robots/r1/.../deploy.yaml (Apache-2.0)
pd:
  leg:   {kp: 100, kd: 2}    # hip pitch/roll/yaw, knee
  ankle: {kp: 40,  kd: 2}
  waist: {kp: 100, kd: 2}
  shoulder: {kp: 40, kd: 2}  # shoulder pitch/roll
  arm:   {kp: 20,  kd: 1}    # shoulder yaw, elbow, wrist roll
# Joints that exist in the MJCF but have ctrlrange [0,0] and no limits (unactuated in Unitree's deploy map):
# waist_pitch, left/right wrist_pitch, left/right wrist_yaw (in unitree_mujoco R1_C++.xml). unitree_rl_mjlab's r1.xml
# has them fixed, which is the model we use. Result: 24 actuated DoF.
foot_mu: 1.0                 # ASSUMPTION: mjlab uses 0.6; at 0.6 the stiff-PD stand slips and falls 6/10 from 0.02 rad noise
integrator: implicitfast
armature: 0.03               # ASSUMPTION. unitree_rl_mjlab r1_constants.py uses 0.01 for every joint (placeholder-looking). At 0.01 and
                             # dt=5 ms the stiff stand falls 16/16 from 0.025 rad white target noise; at 0.03 3/16 (docs/MODEL_AUDIT.md)
action_scale: 0.25           # rad, same as unitree_rl_mjlab
sensors:
  delay_steps: [0, 2]        # control steps of observation latency, sampled per episode (0-40 ms), mjlab#1230 idea
  noise: {ang_vel: 0.2, gravity: 0.05, joint_pos: 0.01, joint_vel: 1.5}
fall:
  min_pelvis_z: 0.45         # [m]; home pelvis z is ~0.70
  max_tilt_deg: 60
action_filter: 0.3           # EMA on policy actions (tau ~17 ms) to keep exploration noise out of the feet
                             # stand on R1's small feet falls from white 0.01 rad leg-target noise without it (sweep in docs/MODEL_AUDIT.md)

opponent_model: r1   # r1 (fight clips retargeted onto an R1) | g1 (raw KungFuAthleteBot G1, kinematic only)
# policy (default): the opponent is a second R1 on its own motors, driven by a motion-tracking policy (gpu/r1_track_task.py)
#         that performs the cleaned fight clips; no assist. Its motors always use the tracker's training contract (Unitree
#         gains kp 100/40, mjlab torque caps, armature 0.01), whatever the protagonist uses.
# puppet: a second R1 (opponent_gains, opponent_cap_policy) whose pelvis gets a force-limited assist toward the clip
#         (horizontal <= 250 N, vertical <= 600 N, torque <= 150 N*m). In the old demo that assist carried ~80% of its weight.
# kinematic: the original infinite-mass replay; in range it pushes through the R1 with 4-12 kN peaks, so don't train on it.
robot_contact: shell          # robot vs robot: visible shells (mesh hulls) collide | capsule: Unitree's capsules (thinner; clipped) - r1gym/model.py
opponent_mode: policy
opponent_policy: results/opponent_tracker/policy.onnx   # relative to the repo root; motion_index.json sits next to it
opponent_gains: stand_pd      # puppet mode only
opponent_cap_policy: min      # puppet mode only
opponent_armature: 0.03       # puppet mode only
# Landed-hit metric (r1gym/hits.py HitMeter; definitions preregistered in docs/AIMED_OPPONENT.md). It only reads the sim.
hit_metric:
  merge_gap_s: 0.1       # contact substeps of one (opponent limb group, R1 zone) at most this far apart are one episode: a contact-free gap of up to 95 ms (a bounce is one hit)
  min_impulse_Ns: 0.5    # landed: impulse over the episode (median physical head hit ~2.2 N*s in the review probe)
  min_peak_N: 5          # landed: peak normal force; below it a touch, not a hit
  v_close_min: 1.0       # clean strike: closing speed along the contact normal at first touch [m/s]
  max_strike_s: 0.15     # clean strike: episode duration; longer is a press
